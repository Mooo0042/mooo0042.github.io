<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clothing Review Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE7D9;
    --bg-fiber:#e4ddc9;
    --panel:#FFFDF8;
    --ink:#262220;
    --ink-soft:#6b6259;
    --thread-red:#B23A38;
    --thread-red-dark:#8f2c2b;
    --thread-teal:#2F6F66;
    --mustard:#D9A441;
    --line:#d8cfba;
    --line-strong:#c3b89d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0) 0 0/14px 14px,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* ---------- Header ---------- */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--thread-teal);
    display:flex;align-items:center;gap:8px;
    margin-bottom:10px;
  }
  .eyebrow::before{
    content:"";
    width:22px;height:1px;background:var(--thread-teal);
    display:inline-block;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(32px,4.6vw,52px);
    line-height:1.02;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  h1 em{
    font-style:italic;
    color:var(--thread-red);
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:15px;
    max-width:560px;
    line-height:1.5;
    margin:0 0 22px;
  }

  .lang-switch{
    display:inline-flex;
    gap:6px;
    background:var(--panel);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:4px;
  }
  .lang-switch button{
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    letter-spacing:.03em;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .lang-switch button.active{
    background:var(--ink);
    color:#fff;
  }
  .lang-switch button:not(.active):hover{
    background:var(--bg-fiber);
    color:var(--ink);
  }

  /* ---------- Layout ---------- */
  .app{
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:28px;
    align-items:start;
    margin-top:28px;
  }
  @media (max-width:880px){
    .app{grid-template-columns:1fr;}
  }

  /* ---------- Form panel ---------- */
  .form-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 22px 18px;
  }
  .category{
    border:none;
    border-bottom:1px dashed var(--line-strong);
    padding:16px 0;
    margin:0;
  }
  .category:last-of-type{border-bottom:none;}
  .category legend{
    padding:0;
    display:flex;
    align-items:baseline;
    gap:8px;
    width:100%;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    margin-bottom:10px;
    color:var(--ink);
  }
  .category legend .num{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--thread-red);
    letter-spacing:.05em;
  }
  .options{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .opt{
    position:relative;
  }
  .opt input{
    position:absolute;
    opacity:0;
    width:100%;height:100%;
    margin:0;
    cursor:pointer;
  }
  .opt label{
    display:inline-block;
    font-size:13px;
    line-height:1.3;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .12s ease;
    user-select:none;
  }
  .opt label:hover{border-color:var(--thread-teal); color:var(--ink);}
  .opt input:checked + label{
    background:var(--thread-teal);
    border-color:var(--thread-teal);
    color:#fff;
    font-weight:600;
  }
  .opt.hide-opt label{
    border-style:dashed;
    color:#a49a8c;
  }
  .opt.hide-opt input:checked + label{
    background:var(--ink-soft);
    border-color:var(--ink-soft);
    color:#fff;
  }

  .rating-row{display:flex;flex-wrap:wrap;gap:7px;}
  .rating-row .opt label{
    min-width:34px;
    text-align:center;
    font-family:'Space Mono',monospace;
  }
  .rating-row .opt input:checked + label{
    background:var(--mustard);
    border-color:var(--mustard);
    color:#2a2116;
  }

  .overall-row{
    display:flex;
    gap:7px;
    margin-bottom:6px;
  }
  .overall-row .opt label{
    font-size:14px;
    font-weight:600;
    padding:9px 16px;
  }
  .overall-row .opt input:checked + label{
    background:var(--thread-red);
    border-color:var(--thread-red);
  }

  /* ---------- Tag panel ---------- */
  .tag-panel{position:sticky; top:24px;}
  .tag-shell{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .string{
    width:2px;
    height:34px;
    background:repeating-linear-gradient(180deg, var(--ink-soft) 0 5px, transparent 5px 9px);
    margin-bottom:-2px;
  }
  .tag{
    position:relative;
    width:100%;
    background:var(--panel);
    border:1px solid var(--line-strong);
    border-radius:16px 16px 40px 40px / 16px 16px 22px 22px;
    padding:34px 26px 26px;
    box-shadow:0 18px 34px -18px rgba(38,34,32,.35);
    transform:rotate(-0.6deg);
  }
  .tag::before{
    content:"";
    position:absolute;
    top:16px; left:50%;
    transform:translateX(-50%);
    width:16px;height:16px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--line-strong);
    box-shadow:inset 0 0 0 3px var(--panel);
  }
  .tag::after{
    content:"";
    position:absolute;
    inset:9px;
    border:1.5px dashed var(--line-strong);
    border-radius:11px 11px 34px 34px / 11px 11px 18px 18px;
    pointer-events:none;
  }
  .tag-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:14px;
  }
  .tag-verdict{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:19px;
  }
  .tag-verdict.yes{color:var(--thread-teal);}
  .tag-verdict.no{color:var(--thread-red);}
  .tag-score{
    font-family:'Space Mono',monospace;
    font-size:12px;
    background:var(--mustard);
    color:#2a2116;
    padding:4px 9px;
    border-radius:6px;
    white-space:nowrap;
  }
  #output{
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    line-height:1.65;
    white-space:pre-wrap;
    color:var(--ink);
    max-height:56vh;
    overflow-y:auto;
    padding-right:4px;
  }
  #output::-webkit-scrollbar{width:6px;}
  #output::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:3px;}

  .tag-actions{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    border:none;
    border-radius:8px;
    padding:11px 14px;
    cursor:pointer;
    flex:1;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
  .btn-ghost:hover{border-color:var(--ink);}
  .copied-flag{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--thread-teal);
    text-align:center;
    height:16px;
    margin-top:8px;
    opacity:0;
    transition:opacity .2s ease;
  }
  .copied-flag.show{opacity:1;}

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-family:'Space Mono',monospace;
    font-size:11px;
    margin-top:36px;
    letter-spacing:.02em;
  }
</style>
</head>
<body>

</div>

/* ============================= STATE ============================= */
let lang = "en";
const state = {
  overall: "yes",
  ratings: {},      // key -> selected option index, or "hide"
  score: 8
};
// init defaults
DATA.en.categories.forEach(c => state.ratings[c.key] = 0);

/* ============================= RENDER FORM ============================= */
function renderForm(){
  const d = DATA[lang];
  const form = document.getElementById("formPanel");
  form.innerHTML = "";

  // overall
  const overallField = document.createElement("fieldset");
  overallField.className = "category";
  overallField.innerHTML = `
    <legend><span class="num">00</span> ${lang==='de' ? 'Gesamturteil' : (lang==='uwu' ? 'Ovewaww' : 'Overall')}</legend>
    <div class="overall-row">
      <div class="opt">
        <input type="radio" name="overall" id="ov-yes" ${state.overall==='yes'?'checked':''}>
        <label for="ov-yes">${d.ui.recommended}</label>
      </div>
      <div class="opt">
        <input type="radio" name="overall" id="ov-no" ${state.overall==='no'?'checked':''}>
        <label for="ov-no">${d.ui.notRecommended}</label>
      </div>
    </div>`;
  overallField.querySelector("#ov-yes").addEventListener("change", () => { state.overall='yes'; update(); });
  overallField.querySelector("#ov-no").addEventListener("change", () => { state.overall='no'; update(); });
  form.appendChild(overallField);

  d.categories.forEach((cat, ci) => {
    const field = document.createElement("fieldset");
    field.className = "category";
    const num = String(ci+1).padStart(2,"0");
    let optsHtml = "";
    cat.options.forEach((opt, oi) => {
      const id = `${cat.key}-${oi}`;
      const checked = state.ratings[cat.key] === oi ? "checked" : "";
      optsHtml += `<div class="opt">
        <input type="radio" name="${cat.key}" id="${id}" ${checked}>
        <label for="${id}">${opt}</label>
      </div>`;
    });
    const hideId = `${cat.key}-hide`;
    const hideChecked = state.ratings[cat.key] === "hide" ? "checked" : "";
    optsHtml += `<div class="opt hide-opt">
      <input type="radio" name="${cat.key}" id="${hideId}" ${hideChecked}>
      <label for="${hideId}">${d.ui.hide}</label>
    </div>`;

    field.innerHTML = `<legend><span class="num">${num}</span> ${cat.name}</legend>
      <div class="options">${optsHtml}</div>`;
    form.appendChild(field);

    cat.options.forEach((opt, oi) => {
      field.querySelector(`#${cat.key}-${oi}`).addEventListener("change", () => {
        state.ratings[cat.key] = oi; update();
      });
    });
    field.querySelector(`#${hideId}`).addEventListener("change", () => {
      state.ratings[cat.key] = "hide"; update();
    });
  });

  // rating
  const ratingField = document.createElement("fieldset");
  ratingField.className = "category";
  let ratingOpts = "";
  for(let i=1;i<=10;i++){
    const id = `score-${i}`;
    ratingOpts += `<div class="opt">
      <input type="radio" name="score" id="${id}" ${state.score===i?'checked':''}>
      <label for="${id}">${i}</label>
    </div>`;
  }
  ratingField.innerHTML = `<legend><span class="num">12</span> ${d.ui.ratingLabel}</legend>
    <div class="rating-row">${ratingOpts}</div>`;
  form.appendChild(ratingField);
  for(let i=1;i<=10;i++){
    ratingField.querySelector(`#score-${i}`).addEventListener("change", () => { state.score=i; update(); });
  }
}

/* ============================= OUTPUT ============================= */
function buildOutput(){
  const d = DATA[lang];
  const lines = [];
  const verdict = state.overall === "yes" ? d.ui.recommended : d.ui.notRecommended;
  lines.push(`${state.overall==='yes' ? '☑' : '☐'} ${verdict}`);
  lines.push("");

  d.categories.forEach(cat => {
    const sel = state.ratings[cat.key];
    if (sel === "hide") return;
    lines.push(`* ${cat.name}`);
    cat.options.forEach((opt, oi) => {
      lines.push(`${oi===sel ? '☑' : '☐'} ${opt}`);
    });
    lines.push("");
  });

  lines.push(`* ${d.ui.ratingLabel}`);
  lines.push(`${state.score} ${d.ui.outOf}`);

  lines.push("");
  lines.push("Generated with Clothing Review Template");
  lines.push("https://mooo0042.github.io/clothing-review-template/");

  return lines.join("\n");
}

function update(){
  const d = DATA[lang];
  document.getElementById("output").textContent = buildOutput();
  const verdictEl = document.getElementById("tagVerdict");
  verdictEl.textContent = state.overall === "yes" ? d.ui.recommended : d.ui.notRecommended;
  verdictEl.className = "tag-verdict " + (state.overall === "yes" ? "yes" : "no");
  document.getElementById("tagScore").textContent = `${state.score} ${d.ui.outOf}`;
}

/* ============================= CHROME (title, subtitle, etc) ============================= */
function renderChrome(){
  const d = DATA[lang];
  document.getElementById("title").innerHTML = `${d.ui.titlePre}<em>${d.ui.titleEm}</em>${d.ui.titlePost}`;
  document.getElementById("copyBtn").textContent = d.ui.copy;
  document.documentElement.lang = lang === "uwu" ? "en" : lang;

  document.querySelectorAll("#langSwitch button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

/* ============================= INIT / EVENTS ============================= */
document.getElementById("langSwitch").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-lang]");
  if (!btn) return;
  lang = btn.dataset.lang;
  // keep same option indices across languages (state.ratings keyed by same cat.key & indices)
  renderChrome();
  renderForm();
  update();
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = document.getElementById("output").textContent;
  const flag = document.getElementById("copiedFlag");
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  flag.textContent = DATA[lang].ui.copied;
  flag.classList.add("show");
  setTimeout(() => flag.classList.remove("show"), 1800);
});

renderChrome();
renderForm();
update();
</script>
</body>
</html>
